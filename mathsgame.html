<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兒童個位數加法挑戰賽</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .progress {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }
        .equation-box {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .num-box {
            background-color: #eef2f7;
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 60px;
        }
        .ans-input {
            font-size: 40px;
            width: 90px;
            text-align: center;
            border: 3px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            padding: 5px;
        }
        .ans-input:focus {
            border-color: #3b82f6;
        }
        .btn-submit {
            background-color: #3b82f6;
            color: white;
            border: none;
            font-size: 22px;
            padding: 12px 40px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #2563eb;
        }
        .feedback {
            margin-top: 15px;
            font-size: 20px;
            height: 24px;
            font-weight: bold;
        }
        .correct { color: #10b981; }
        .wrong { color: #ef4444; }
        .result-screen {
            display: none;
        }
        .result-screen h2 {
            color: #10b981;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .stats-box {
            background-color: #f0fdf4;
            border: 2px solid #bbf7d0;
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            text-align: left;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn-restart {
            background-color: #10b981;
            color: white;
            border: none;
            font-size: 20px;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        /* 隱藏 Chrome/Safari/Opera 的輸入框上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 遊戲進行畫面 -->
    <div id="quiz-screen">
        <div class="progress">第 <span id="current-question">1</span> / 30 題</div>
        
        <div class="equation-box">
            <span class="num-box" id="num1">0</span>
            <span>+</span>
            <span class="num-box" id="num2">0</span>
            <span>=</span>
            <input type="number" id="user-answer" class="ans-input" autofocus autocomplete="off">
        </div>

        <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">提交答案</button>
        <div class="feedback" id="feedback-msg"></div>
    </div>

    <!-- 挑戰成功畫面 -->
    <div id="result-screen" class="result-screen">
        <h2>🎉 挑戰成功！ 🎉</h2>
        <div class="stats-box">
            📌 <b>總共題數：</b> 30 題<br>
            ✅ <b>答對題數：</b> <span id="stat-correct" style="color:#10b981; font-weight:bold;">0</span> 題<br>
            ❌ <b>答錯題數：</b> <span id="stat-wrong" style="color:#ef4444; font-weight:bold;">0</span> 題<br>
            ⏱️ <b>總共用時：</b> <span id="stat-time" style="color:#3b82f6; font-weight:bold;">0</span> 秒
        </div>
        <button class="btn-restart" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
    let currentNum1 = 0;
    let currentNum2 = 0;
    let questionCount = 0;
    let correctCount = 0;
    let startTime = null;

    const maxQuestions = 30;

    function generateQuestion() {
        if (questionCount >= maxQuestions) {
            endGame();
            return;
        }
        
        // 隨機產生 0-9 的個位數字
        currentNum1 = Math.floor(Math.random() * 10);
        currentNum2 = Math.floor(Math.random() * 10);
        
        document.getElementById('num1').innerText = currentNum1;
        document.getElementById('num2').innerText = currentNum2;
        document.getElementById('user-answer').value = '';
        document.getElementById('current-question').innerText = questionCount + 1;
        document.getElementById('feedback-msg').innerText = '';
        
        // 自動聚焦到輸入框
        document.getElementById('user-answer').focus();
    }

    function checkAnswer() {
        const inputField = document.getElementById('user-answer');
        const userAnswer = parseInt(inputField.value);
        const feedback = document.getElementById('feedback-msg');
        
        // 防呆：如果沒有輸入內容，不進行下一步
        if (isNaN(userAnswer)) {
            feedback.innerHTML = '<span class="wrong">請先輸入答案填空喔！</span>';
            return;
        }

        const correctAnswer = currentNum1 + currentNum2;
        
        if (userAnswer === correctAnswer) {
            correctCount++;
            feedback.innerHTML = '<span class="correct">👍 答對了！</span>';
        } else {
            feedback.innerHTML = `<span class="wrong">❌ 答錯囉！（答案是 ${correctAnswer}）</span>`;
        }

        questionCount++;

        // 稍微延遲 0.8 秒再進入下一題，讓小朋友看得到對錯反饋
        document.getElementById('submit-btn').disabled = true;
        setTimeout(() => {
            document.getElementById('submit-btn').disabled = false;
            generateQuestion();
        }, 800);
    }

    function endGame() {
        const endTime = new Date();
        const totalTimeSeconds = Math.floor((endTime - startTime) / 1000);
        const wrongCount = maxQuestions - correctCount;

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        document.getElementById('stat-correct').innerText = correctCount;
        document.getElementById('stat-wrong').innerText = wrongCount;
        document.getElementById('stat-time').innerText = totalTimeSeconds;
    }

    function resetGame() {
        questionCount = 0;
        correctCount = 0;
        startTime = new Date(); // 重新開始計時
        
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        
        generateQuestion();
    }

    // 支援按下 Enter 鍵直接提交
    document.getElementById('user-answer').addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    });

    // 網頁載入後自動啟動遊戲
    window.onload = function() {
        resetGame();
    };
</script>

</body>
</html>
